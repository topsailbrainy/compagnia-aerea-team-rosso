  # GATE
  /gate:
    get:
      summary: Lista tutti i gate
      responses:
        '200':
          description: Successo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Gate'
    post:
      summary: Crea un nuovo gate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GateInput'
      responses:
        '201':
          description: Creato
  /gate/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Ottieni un gate per ID
      responses:
        '200':
          description: Successo
          content:
            application/json:
              schema:
