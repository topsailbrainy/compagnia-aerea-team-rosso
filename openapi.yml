    delete:
      summary: Elimina un documento
      responses:
        '204':
          description: Eliminato

components:
  schemas:
    Aeroporto:
      type: object
      required:
        - nome
        - aereo_id
        - gate_id
        - citta
      properties:
        nome:
          type: string
        aereo_id:
          type: integer
        gate_id:
          type: integer
        citta:
          type: string

    AereoInput:
      type: object
      required:
        - capienza
        - stato
        - modello
      properties:
        capienza:
          type: integer
        stato:
          type: boolean
        modello:
          type: string

    Aereo:
      allOf:
        - $ref: '#/components/schemas/AereoInput'
        - type: object
          properties:
            id:
              type: integer

    VoloInput:
      type: object
      required:
        - tratte_id
        - aerei_id
        - partenza
        - arrivo
      properties:
        tratte_id:
          type: integer
        aerei_id:
          type: integer
        partenza:
          type: number
          format: decimal
        arrivo:
          type: number
          format: decimal

    Volo:
      allOf:
        - $ref: '#/components/schemas/VoloInput'
        - type: object
          properties:
            id:
              type: integer

    UtenteInput:
      type: object
      required:
        - nome
        - cognome
        - email
        - documenti_id
      properties:
        nome:
          type: string
        cognome:
          type: string
        email:
          type: string
          format: email
        documenti_id:
          type: integer

    Utente:
      allOf:
        - $ref: '#/components/schemas/UtenteInput'
        - type: object
          properties:
            id:
              type: integer

    PrenotazioneInput:
      type: object
      required:
        - utente_id
        - passeggeri
        - tratta_id
      properties:
        utente_id:
          type: integer
        passeggeri:
          type: integer
        tratta_id:
          type: integer

    Prenotazione:
      allOf:
        - $ref: '#/components/schemas/PrenotazioneInput'
        - type: object
          properties:
            id:
              type: integer

    BigliettoInput:
      type: object
      required:
        - utente_id
        - gate_id
      properties:
        utente_id:
          type: integer
        gate_id:
          type: integer

    Biglietto:
      allOf:
        - $ref: '#/components/schemas/BigliettoInput'
        - type: object
          properties:
            id:
              type: integer

    GateInput:
      type: object
      required:
        - aeroporto_nome
        - voli_id
      properties:
        aeroporto_nome:
          type: string
        voli_id:
          type: integer

    Gate:
      allOf:
        - $ref: '#/components/schemas/GateInput'
        - type: object
          properties:
            id:
              type: integer

    TrattaInput:
      type: object
      required:
        - nome
      properties:
        nome:
          type: string

    Tratta:
      allOf:
        - $ref: '#/components/schemas/TrattaInput'
        - type: object
          properties:
            id:
              type: integer

    DocumentoInput:
      type: object
      required:
        - utente_id
        - documento
      properties:
        utente_id:
          type: integer
        documento:
          type: string
          format: binary
          description: Rappresentazione base64 del file (BYTEA)

    Documento:
      allOf:
        - $ref: '#/components/schemas/DocumentoInput'
        - type: object
          properties:
            id:
              type: integer
