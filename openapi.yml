    put:
      summary: Aggiorna un gate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GateInput'
      responses:
        '200':
          description: Aggiornato
    delete:
      summary: Elimina un gate
      responses:
        '204':
          description: Eliminato

  # TRATTE
  /tratte:
    get:
      summary: Lista tutte le tratte
      responses:
        '200':
          description: Successo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tratta'
    post:
      summary: Crea una nuova tratta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrattaInput'
      responses:
        '201':
          description: Creatata
  /tratte/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Ottieni una tratta per ID
      responses:
        '200':
          description: Successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tratta'
    put:
      summary: Aggiorna una tratta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrattaInput'
      responses:
        '200':
          description: Aggiornata
    delete:
      summary: Elimina una tratta
      responses:
        '204':
          description: Eliminata

  # DOCUMENTI
  /documenti:
    get:
      summary: Lista tutti i documenti
      responses:
        '200':
          description: Successo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Documento'
    post:
      summary: Carica un nuovo documento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentoInput'
      responses:
        '201':
          description: Creato
  /documenti/{id}:
    parameters:
      - name: id
        in: path
        required: true
