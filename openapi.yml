openapi: 3.0.3
info:
  title: API Compagnia Aerea
  description: API per la gestione di voli, prenotazioni, utenti e infrastrutture aeroportuali.
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Server di sviluppo

paths:
  # AEROPORTI
  /aeroporti:
    get:
      summary: Lista tutti gli aeroporti
      responses:
        '200':
          description: Successo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Aeroporto'
    post:
      summary: Crea un nuovo aeroporto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Aeroporto'
      responses:
        '201':
          description: Creato
  /aeroporti/{nome}:
    parameters:
      - name: nome
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Ottieni un aeroporto per nome
      responses:
        '200':
          description: Successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Aeroporto'
    put:
      summary: Aggiorna un aeroporto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Aeroporto'
      responses:
        '200':
          description: Aggiornato
    delete:
      summary: Elimina un aeroporto
      responses:
        '204':
          description: Eliminato

  # AEREI
  /aerei:
    get:
      summary: Lista tutti gli aerei
      responses:
        '200':
          description: Successo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Aereo'
    post:
      summary: Crea un nuovo aereo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AereoInput'
      responses:
        '201':
          description: Creato
  /aerei/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Ottieni un aereo per ID
      responses:
        '200':
          description: Successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Aereo'
    put:
      summary: Aggiorna un aereo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AereoInput'
      responses:
        '200':
          description: Aggiornato
    delete:
      summary: Elimina un aereo
      responses:
        '204':
          description: Eliminato

  # VOLI
  /voli:
    get:
      summary: Lista tutti i voli
      responses:
        '200':
          description: Successo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Volo'
    post:
      summary: Crea un nuovo volo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoloInput'
      responses:
        '201':
          description: Creato
  /voli/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Ottieni un volo per ID
      responses:
        '200':
          description: Successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Volo'
    put:
      summary: Aggiorna un volo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoloInput'
      responses:
        '200':
          description: Aggiornato
    delete:
      summary: Elimina un volo
      responses:
        '204':
          description: Eliminato

  # UTENTI
  /utenti:
    get:
      summary: Lista tutti gli utenti
      responses:
        '200':
          description: Successo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Utente'
    post:
      summary: Crea un nuovo utente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UtenteInput'
      responses:
        '201':
          description: Creato
  /utenti/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Ottieni un utente per ID
      responses:
        '200':
          description: Successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Utente'
    put:
      summary: Aggiorna un utente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UtenteInput'
      responses:
        '200':
          description: Aggiornato
    delete:
      summary: Elimina un utente
      responses:
        '204':
          description: Eliminato

  # PRENOTAZIONI
  /prenotazioni:
    get:
      summary: Lista tutte le prenotazioni
      responses:
        '200':
          description: Successo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Prenotazione'
    post:
      summary: Crea una nuova prenotazione
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrenotazioneInput'
      responses:
        '201':
          description: Creata
  /prenotazioni/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Ottieni una prenotazione per ID
      responses:
        '200':
          description: Successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prenotazione'
    put:
      summary: Aggiorna una prenotazione
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrenotazioneInput'
      responses:
        '200':
          description: Aggiornata
    delete:
      summary: Elimina una prenotazione
      responses:
        '204':
          description: Eliminata

  # BIGLIETTI
  /biglietti:
    get:
      summary: Lista tutti i biglietti
      responses:
        '200':
          description: Successo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Biglietto'
    post:
      summary: Crea un nuovo biglietto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BigliettoInput'
      responses:
        '201':
          description: Creato
  /biglietti/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Ottieni un biglietto per ID
      responses:
