services:
  dbms:
    image: postgres:17-alpine
    container_name: dbms
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_USER=${DB_USER:-postgres}
    volumes:
    
      - pgdata:/var/lib/postgresql/data 
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      db-net:
        aliases:
          - dbms.local

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      db-net:
        aliases:
          - adminer.local

volumes:
  pgdata:

networks:
  db-net:
    driver: bridge
